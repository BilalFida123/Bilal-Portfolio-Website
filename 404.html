<!DOCTYPE html>

<head>

<link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png"/>
<script>
  (function () {
    var saved = localStorage.getItem('bf-theme');
    var theme = (saved === 'light' || saved === 'dark') ? saved :
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link href="assets/css/main.css" rel="stylesheet"/>
<style>
  .nf-wrap { min-height: 80vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; }

  .nf-title { font-family: var(--font-heading); font-size: clamp(20px, 3vw, 28px); font-weight: 600; color: var(--c-ink); margin-top: 8px; }
  .nf-desc { color: var(--c-text); max-width: 420px; margin: 14px 0 28px; }
</style>
</head>
